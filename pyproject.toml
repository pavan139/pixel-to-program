[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-to-program-lab"
version = "0.1.0"
description = "Spatial attention program synthesis with constrained beam search, paired experiments and atomic training resume"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.3,<3"]

[project.scripts]
pixel-to-program = "pixel_to_program.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
