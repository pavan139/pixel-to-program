name: Visual-program tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python tools/check_vision.py --require-lint --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-py${{ matrix.python }}
          path: reports/verification.json
